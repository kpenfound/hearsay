# Template: issue-driven
#
# A person writes feature issues and the full staff takes them from there: the
# product manager breaks each one into work items, the project manager triages
# them, developers and reviewers build them, and QA tests the default branch
# after every merge. A person approves each feature a bee proposes and merges
# each approved pull request.

# bees.toml — configuration for a busybees software factory.
#
# Every option is listed here. Lines starting with "#" are commented out and
# show the default value; uncomment a line to change it. Run
# `bees config show` to see the resolved settings for every role.

# Format version of this file. bees refuses files newer than it understands and
# upgrades older ones in memory. Leave it alone; bees releases that change the
# format say what to do.
version = 3

#===============================================================================
# Project
#===============================================================================
[project]
# Git remote the factory fetches from and pushes to.
#remote = "origin"
# GitHub repository, as owner/name. Derived from the remote's URL when unset.
#repo = "kpenfound/hearsay"
# Branch developers branch from and QA tests. Derived from the remote's HEAD
# when unset.
#default_branch = "main"
# What the product is and how to build, test and run it belong in the
# repository's own documentation (README, CONTRIBUTING, CLAUDE.md); the roles
# read it and keep what they learn in their notes.
# Directory for mail, notes, session logs and scheduler state, relative to
# this file. `bees init` adds it to .gitignore.
#state_dir = ".bees"
# Prefix for developer branches (bees/issue-12).
#branch_prefix = "bees/"

#===============================================================================
# Visibility filter — which issues and pull requests the factory can see.
# Criteria are ANDed. Everything the factory creates is made to match.
#===============================================================================
[filter]
# The factory's label; also the base name of the workflow labels
# (bees:triage, bees:ready, bees:in-progress, ...).
label = "bees"
# Set to false to let assignee, milestone and/or creator alone define
# visibility. The label is still applied to everything the factory creates.
#require_label = true
# Only see items assigned to this GitHub login. "@me" means the gh user.
# Useful when one person runs busybees for their share of a shared repo.
#assignee = "@me"
# Only see items in this milestone.
#milestone = ""
# Only see items opened by this GitHub login. What the factory opens itself
# is visible too, whoever it acts as.
creator = "kpenfound"

#===============================================================================
# GitHub account the factory acts as. Unset (the default) means the machine
# owner's own gh login, so every issue, comment and label edit looks like it
# came from the person running bees.
#
# login and token go together: set both, or neither. filter.assignee = "@me"
# above is NOT affected — it says whose work the factory picks up, so it keeps
# resolving to the person's own gh login.
#===============================================================================
[github]
# GitHub login the factory acts as.
#login = "busybees-bot"
# A token for that login. A "$VAR" reference is expanded from the environment
# bees runs in, so the secret itself stays out of this file.
#token = "$BEES_GITHUB_TOKEN"
# Identity for commits made by developer sessions. Either may be set on its
# own; whichever is unset stays the machine's own git identity.
#git_name = "busybees"
#git_email = "busybees@example.com"

#===============================================================================
# Scheduler
#===============================================================================
[scheduler]
# How often GitHub is polled for work. Each poll costs two API calls; keep it
# infrequent. Sessions make their own gh calls on top of this.
poll_interval = "5m"
# How long to pause polling after GitHub reports a rate limit.
rate_limit_backoff = "15m"
# Concurrent developer workers. Each runs a sequential developer <-> reviewer
# loop for one issue; reviewer concurrency follows developer concurrency.
max_developers = 2
# Developer/reviewer iterations before an issue is escalated to a human.
#max_review_rounds = 3
# Extra attempts for a session that failed for infrastructure reasons (timeout,
# API error, exhausted turns). A session that ran and reported is never retried.
# 0 disables retrying.
#retries = 1
# How long to wait before retrying a session.
#retry_delay = "10m"
# Run the retry with the role's fallback_model as its primary model.
#retry_with_fallback = true
# Issues handed to the project manager per session.
#triage_batch_size = 5
# Sessions a role runs between two passes in which it is also asked to
# consolidate its notes file into the standard sections.
#notes_consolidate_every = 10
# Ask for consolidation early once a notes file grows past this many bytes.
notes_max_bytes = 22768
# Which ready issue a free developer takes next: small-first, oldest or
# large-first. Ties are broken by age, oldest first.
#dispatch_order = "small-first"
# How many size/l issues developers may work on at once. 0 means no cap.
#max_large_in_flight = 2
# Hand an open pull request that conflicts with the default branch back to its
# developer (mail, and an approved issue returns to ready ahead of new work).
pr_fix_conflicts = true
# Do the same when a pull request merely fell behind the default branch.
pr_keep_updated = true
# Build a blocked_by chain of work items under the same feature as a stack of
# branches and pull requests, each depending on its predecessor's, instead of
# independently.
#stacked_prs = false
# Review every open pull request in the filter that the factory did not write
# (its head branch does not start with branch_prefix), without waiting for the
# review-requested label. With filter.assignee set, that is the pull requests
# assigned to the factory.
review_assigned_prs = false
# A feature issue a bee creates is a proposal: it carries bees:proposal and a
# person approves it by removing the label. false lets a bee break its own
# features down without a person's approval.
feature_proposals = true

# Whole factory, rolling 24 hours. At or over it no new session starts; the
# sessions already running finish.
max_cost_per_day = 300.0
# How far the rolling 24 hours has to fall back, as a percentage of
# max_cost_per_day, before new sessions start again: at 80, a factory paused at
# $100.00 resumes under $80.00 rather than at $99.99.
max_cost_per_day_resume_percent = 80.0
# A single session. Checked after it ran (claude cannot be stopped on cost), and
# an over-budget session is treated as failed.
#max_cost_per_session = 10.0
# Keep temp worktrees after sessions finish (debugging).
#keep_workspaces = false
# Where temp worktrees are created (default: the system temp dir).
#workspace_root = ""

#===============================================================================
# Console logging. The --log-format / --log-level flags and the
# BEES_LOG_FORMAT / BEES_LOG_LEVEL environment variables override these.
#===============================================================================
[logging]
# Console log format: text or json. JSON is for running bees as a service.
#format = "text"
# Console log level: debug, info, warn or error. --quiet is a per-invocation
# shorthand and has no key here; "warn" is the closest equivalent.
#level = "info"


#===============================================================================
# Codex Profiles
#===============================================================================

# [profiles.default]
# agent = "codex"
# model = "gpt-5.6-terra"
# fallback_model = "gpt-5.6-sol"
