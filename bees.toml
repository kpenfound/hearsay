# sandbox = "none"

# [profiles.coder_smart]
# agent = "codex"
# model = "gpt-6-astra"
# fallback_model = "gpt-6-astra"
# effort = "high"

# [profiles.coder_medium]
# agent = "codex"
# model = "gpt-6-sol"
# fallback_model = "gpt-6-astra"
# effort = "high"

# [profiles.coder_dumb]
# agent = "codex"
# model = "gpt-5.6-luna"
# fallback_model = "gpt-5.6-sol"
# effort = "medium"

# [profiles.manager_smart]
# agent = "codex"
# model = "gpt-5.6-sol"
# fallback_model = "gpt-6-astra"
# effort = "high"

# [profiles.manager_dumb]
# agent = "codex"
# model = "gpt-5.6-terra"
# fallback_model = "gpt-5.6-sol"
# effort = "medium"

#===============================================================================
# Claude Profiles
#===============================================================================

[profiles.default]
agent = "claude"
model = "opus"
fallback_model = "fable"
effort = "high"
sandbox = "none"

[profiles.review_fast]
agent = "claude"
model = "opus"
fallback_model = "fable"
effort = "medium"
sandbox = "none"

[profiles.coder_smart]
agent = "claude"
model = "fable"
effort = "medium"

[profiles.coder_medium]
agent = "claude"
model = "opus"
fallback_model = "fable"
effort = "medium"

[profiles.coder_dumb]
agent = "claude"
model = "opus"
fallback_model = "fable"
effort = "low"

[profiles.manager_smart]
agent = "claude"
model = "opus"
fallback_model = "fable"
effort = "medium"

[profiles.manager_dumb]
agent = "claude"
model = "opus"
fallback_model = "fable"
effort = "low"


#===============================================================================
# Global role settings — apply to every role, merged with [roles.<name>]:
# prompts concatenate (global first), skills union, env and mcp servers union
# (the role wins on a name conflict), scalars fall back to global then defaults.
#===============================================================================
[global]
profile = "default"
# Text appended to every role's base prompt.
#prompt = """
#"""
# File whose contents are appended after prompt (relative to this file).
#prompt_file = "docs/team-conventions.md"
# Skills by git URL: <url>[@ref][#sub/dir], cloned and exposed to claude as
# plugins. Skills in the repository's .claude/skills/ and in ~/.claude/skills/
# are available automatically and need not be listed.
skills = [
  "https://github.com/poteto/plugins#pstack/skills/unslop",
]
# How stale a skill clone may get before it is pulled: never, always or a
# duration. Global only; see "bees skills".
#skills_refresh = "24h"
max_turns = 300
timeout = "1h"
# Tool restrictions passed straight to claude.
#allowed_tools = []
disallowed_tools = ["Artifact", "Bash(go test *)", "Bash(docker *)"]
# Shell for claude's Bash tool in sessions (exported as $SHELL).
#shell = "/bin/bash"

# Environment variables exported into every session (claude, its Bash tool,
# MCP servers, git). $VARS are expanded from the bees environment. Roles can
# add or override entries in [roles.<name>.env].
[global.env]
DAGGER_X_RELEASE = "v1.0.0-beta.14"


#===============================================================================
# Per-role settings. Every key from [global] is valid here, plus enabled;
# the developer also takes commit_flags, max_size, model_by_size and the
# best-of-N keys, the product manager min_issue_size, and the reviewer the
# auto-merge keys.
#===============================================================================

# Owns the product vision and feature issues; breaks features into work items.
[roles.product_manager]
profile = "manager_smart"
#prompt = """
#"""
# Smallest work item size to aim for when breaking a feature into work items:
# xs, s, m or l. A hint on the split, not a floor: a smaller work item is still
# created wherever the work needs one. Unset, there is no floor.
min_issue_size = "s"
#prompt_file = ""
#skills = []

#max_turns = 200
#timeout = "45m"
enabled = true


# Triages issues into build-ready work and answers developer questions.
[roles.project_manager]
profile = "manager_dumb"
#prompt = """
#"""

#max_turns = 200
#timeout = "45m"
enabled = true


# Implements one issue on a branch and opens a pull request.
[roles.developer]
profile = "coder_medium"
profile_by_size = { s = "coder_dumb", xs = "coder_dumb", l = "coder_smart" }
prompt = """
Validate changes with dagger check.
ONLY RUN TESTS INSIDE DAGGER. DO NOT TEST WITH go test ON THE HOST.
"""
# Extra flags for every git commit the developer makes.
#commit_flags = "--gpg-sign --signoff"
# Largest size a developer takes: xs, s, m, l or xl. Anything bigger is sent
# back to triage for the project manager to split.
max_size = "l"
#max_turns = 200
#timeout = "45m"
enabled = true


# Reviews pull requests and, optionally, merges them once checks are green.
[roles.reviewer]
prompt = """
You do not need to run the tests, the linter or the build yourself: every gate
this repository has is a Dagger check, and Dagger Cloud runs `dagger check` on
every commit, so the pull request's own checks already cover that. Read them
rather than reproducing them, and spend the session on what they cannot tell
you — whether the change is correct, complete and what the issue asked for.
"""
#prompt_file = ""
#skills = []
#max_turns = 200
#timeout = "45m"
# Disabling the reviewer treats pull requests as approved as soon as the
# developer opens them.
enabled = true
# Merge approved pull requests automatically once its checks are green: the
# required checks if the branch has any, otherwise every check the pull
# request reports; with no checks at all it merges and says so. Off: humans
# merge. When checks fail the reviewer diagnoses the main error and hands it
# to the developer to fix (up to max_check_fix_rounds).
auto_merge = true
# squash, merge or rebase.
#merge_method = "squash"
# Wait after approval before polling checks; some take a moment to start.
checks_wait = "30s"

# The review angles a pull request of each size is reviewed from, one or more
# of quick_general, general, docs, test_coverage, acceptance_criteria,
# side_effects. A size not named here gets its default:
angles = { xs = ["quick_general"], s = ["quick_general"], m = ["quick_general", "docs", "test_coverage"], l = ["general", "docs", "test_coverage"], xl = ["general", "docs", "test_coverage", "acceptance_criteria"] }
# Phase execution profiles; unspecified phases use the size-resolved reviewer.
# Brief/angles ignore sandbox and retain the host read-only floor: no commands,
# writes, web/network tools, MCP/factory identity or writable/shared VCS.
# The judge uses all five fields with reviewer-owned tools and permissions.
brief_profile = "default"
judge_profile = "default"
angle_profiles = { quick_general = "review_fast", docs = "review_fast", test_coverage = "default" }


# Tests the default branch after merges, files bugs, reports to the PM.
[roles.qa]
#max_turns = 200
#timeout = "45m"
enabled = false
