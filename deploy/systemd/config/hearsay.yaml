# An example configuration for the systemd deployment, and nothing more: it
# ingests only what an agent posts to the agent session source, so the services
# come up healthy without a GitHub, Discord or Drive credential. Its llm block
# is this deployment's own: claude-sbx for both completion tiers, and Jev
# through OpenRouter for the typed judgments. Replace it
# with your team's own, which `hearsay init` writes (docs/config.md), before
# you point anything real at Hearsay. docs/deploy.md has the steps.
#
# Every principal id, token_env name and source id here is an example.
sources:
  - id: agent-sessions
    type: agent
    containers: ["*"]

scopes:
  - id: team
    name: Example team
    sources: [agent-sessions]

principals:
  - id: operator
    name: Example operator
    token_env: HEARSAY_OPERATOR_TOKEN
    identities:
      - source: agent-sessions
        native_id: operator

  - id: assistant
    name: Example agent
    kind: agent
    class: worker
    token_env: HEARSAY_ASSISTANT_TOKEN
    scopes: ["*"]
    identities:
      - source: agent-sessions
        native_id: assistant

llm:
  tiers:
    # The owner's Claude Code, one tool-free turn in a Docker Sandbox per call.
    # Host-only: it needs sbx, its daemon and a stored login on this machine.
    # The model is passed to Claude Code as written, so its aliases work.
    distill:
      provider: claude-sbx
      model: haiku
      max_tokens: 4096
    assert:
      provider: claude-sbx
      model: sonnet
  judgments:
    # Requested model; each judgment records the version that answered.
    model: ~typesafe/jev-latest
    base_url: https://openrouter.ai/api
    api_key_env: OPENROUTER_API_KEY
