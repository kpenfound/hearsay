name: hearsay

x-service: &service
  image: ${HEARSAY_IMAGE:?set HEARSAY_IMAGE in .env to a published image, such as ghcr.io/kpenfound/hearsay:v0.10.0}
  env_file: [.env]
  environment:
    HEARSAY_CONFIG: /etc/hearsay
  volumes:
    - type: bind
      source: ./config
      target: /etc/hearsay
      read_only: true
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hearsay
      POSTGRES_DB: hearsay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "hearsay", "-d", "hearsay"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    image: ${HEARSAY_IMAGE:?set HEARSAY_IMAGE in .env to a published image, such as ghcr.io/kpenfound/hearsay:v0.10.0}
    command: ["migrate", "up"]
    environment:
      HEARSAY_DATABASE_URL: ${HEARSAY_DATABASE_URL:?set HEARSAY_DATABASE_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  connectors:
    <<: *service
    command: ["connectors"]
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/readyz"]

  distiller:
    <<: *service
    command: ["distiller"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/readyz"]

  assert-worker:
    <<: *service
    command: ["assert-worker"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8083/readyz"]

  api:
    <<: *service
    command: ["api"]
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]

volumes:
  pgdata:
