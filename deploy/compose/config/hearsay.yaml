sources:
  - id: agent-sessions
    type: agent
    containers: ["*"]

scopes:
  - id: team
    name: Example team
    sources: [agent-sessions]

principals:
  - id: operator
    name: Example operator
    token_env: HEARSAY_OPERATOR_TOKEN
    identities:
      - source: agent-sessions
        native_id: operator

  - id: assistant
    name: Example agent
    kind: agent
    class: worker
    token_env: HEARSAY_ASSISTANT_TOKEN
    scopes: ["*"]
    identities:
      - source: agent-sessions
        native_id: assistant

llm:
  judgments:
    model: jev-latest
