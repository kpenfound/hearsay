# CI calls the Dagger module and nothing else, so that what fails here is what
# fails on a laptop: `dagger call check` is the same command in both places.
# Adding a check means adding it to Check in .dagger/main.go, which leaves
# nothing for this file to fall behind on.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          # Pinned, and matching dagger.json's engineVersion: an engine and a
          # module that disagree is a confusing way to fail.
          version: v0.21.9
          call: check
