# Dagger workspace configuration
# Install modules with: dagger install <module>
# Example:
#   dagger install github.com/dagger/dagger/modules/wolfi

[modules.go]
source = "github.com/dagger/go"

[modules.go.settings]
includeExtraFiles = ["docs/config.md", "cmd/hearsay/README.md"]
base = "test-services:go-test-base"
lint = ["!**"]

[modules.dagger-dang-sdk]
source = "github.com/dagger/dang-sdk@5da26366fca40ccbb66ac2f97f57ed95a8f3c17a"

[modules.test-services]
source = ".dagger/modules/test-services"

[modules.hearsay]
source = ".dagger/modules/hearsay"

[modules.dagger-dang-sdk.as-sdk]
name = "dang"

[[modules.dagger-dang-sdk.as-sdk.modules]]
path = ".dagger/modules/test-services"

[[modules.dagger-dang-sdk.as-sdk.modules]]
path = ".dagger/modules/hearsay"
