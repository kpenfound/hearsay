# Dagger workspace configuration
# Install modules with: dagger install <module>
# Example:
#   dagger install github.com/dagger/dagger/modules/wolfi

[modules.go]
source = "github.com/dagger/go"

[modules.go.settings]
includeExtraFiles = ["docs/config.md", "docs/connector-contract.md", "cmd/hearsay/README.md"]
base = "dag://hearsay/go-test-base"
goflags = "-tags=integration -race"

[modules.dagger-dang-sdk]
source = "github.com/dagger/dang-sdk@v1.0.1"

[modules.hearsay]
source = ".dagger/modules/hearsay"

[sdks.dang]
module = "dagger-dang-sdk"

[sdks.dang.scopes.".dagger/modules/hearsay"]
is-module = true

[modules.dagger-skill]
source = "dagger.io/skill"

[modules.golangci-lint]
source = "dagger.io/go/golangci-lint"

[modules.golangci-lint.settings]
# golangci-lint's own image, which pins the version: the module installs
# none into a base that already has the binary.
base = "dag://hearsay/lint-base"
